<text x="70.0" y="44.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#6b7280" text-anchor="start">后轮转角 = 0，所以 ICR 只能落在后轴延长线上。</text>
<text x="70.0" y="520.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#6b7280" text-anchor="start">tan δ_内 = L / (R − t/2)，tan δ_外 = L / (R + t/2)。轮距 t 远小于 R 时，两者几乎相等。</text>

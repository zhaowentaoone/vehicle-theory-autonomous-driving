<path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1f2937"/></marker></defs>
<rect x="0" y="0" width="860" height="36" fill="#f8fafc"/>
<text x="20.0" y="24.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start">图 2-5　前轮对准 ICR：直角三角形给出 R = L / tanδ，再得到 ψ̇</text>
<polygon points="395.8,320.5 395.8,390.7 187.8,390.7 187.8,320.5" fill="#e5e7eb" stroke="#374151" stroke-width="1.7"/>

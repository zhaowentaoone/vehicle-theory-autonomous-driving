<line x1="266.8" y1="337.4" x2="285.0" y2="337.4" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="339.6" y="372.2" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#ea580c" text-anchor="middle">轴距 L</text>
<text x="238.2" y="225.6" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="end">R</text>
<text x="425.4" y="295.8" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#15803d" text-anchor="start">δ</text>
<rect x="560" y="70" width="280" height="390" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
<text x="578.0" y="100.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">对直角三角形：</text>
<text x="578.0" y="132.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#6b7280" text-anchor="start">对边 L，邻边 R</text>
<text x="578.0" y="164.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="start">tan δ = L / R</text>
<text x="578.0" y="196.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">于是  R = L / tanδ</text>
<text x="578.0" y="228.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">刚体绕 ICR 转：</text>
<text x="578.0" y="260.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#6b7280" text-anchor="start">后轴线速度 v = ω R</text>
<text x="578.0" y="292.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#6b7280" text-anchor="start">ω 就是横摆角速度 ψ̇</text>
<text x="578.0" y="324.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#ea580c" text-anchor="start">所以  ψ̇ = v / R</text>
<text x="578.0" y="356.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">代入 R：</text>
<text x="578.0" y="388.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="start">ψ̇ = (v / L) tanδ</text>
</svg>
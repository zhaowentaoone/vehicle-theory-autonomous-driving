<circle cx="266.8" cy="355.6" r="5.5" fill="#2563eb" stroke="#1f2937" stroke-width="1"/>
<circle cx="412.4" cy="355.6" r="5.5" fill="#dc2626" stroke="#1f2937" stroke-width="1"/>
<circle cx="266.8" cy="95.6" r="6.5" fill="#ffffff" stroke="#dc2626" stroke-width="1.7"/>
<text x="254.8" y="85.6" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="end">ICR</text>
<line x1="266.8" y1="355.6" x2="412.4" y2="355.6" stroke="#ea580c" stroke-width="2.2" fill="none"/>
<line x1="266.8" y1="355.6" x2="266.8" y2="95.6" stroke="#2563eb" stroke-width="2.2" fill="none"/>

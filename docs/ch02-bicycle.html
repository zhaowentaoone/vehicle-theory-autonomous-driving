<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第 02 章　自行车模型与 ICR</title>
  <style>
    :root {
      --bg: #f7f7f5; --card: #fff; --ink: #1f2937; --muted: #6b7280;
      --line: #e5e7eb; --blue: #2563eb; --orange: #ea580c; --green: #15803d;
      --red: #dc2626; --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-size: 24px; margin: 0 0 8px; font-weight: 650; }
    .lead { color: var(--muted); margin: 0 0 20px; line-height: 1.6; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tab { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.9fr); gap: 20px; align-items: start; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    svg { display: block; width: 100%; height: auto; background: #fff; }
    label.row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    label.row span { font-weight: 500; color: var(--muted); }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .stats { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 10px; }
    .stat b { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .side h3 { margin: 0 0 10px; font-size: 14px; }
    .side p, .side pre { margin: 0 0 8px; font-size: 13px; line-height: 1.55; }
    .side pre { background: #f3f4f6; padding: 10px; border-radius: 8px; overflow: auto; }
    .warn { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #fff7ed; color: #9a3412; font-size: 13px; line-height: 1.5; }
    .ok { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #f0fdf4; color: #166534; font-size: 13px; line-height: 1.5; }
    .nav { font-size: 13px; margin-bottom: 18px; }
    .nav a { color: var(--accent); }
    button.play { margin-top: 10px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav"><a href="./index.html">课程主页</a> · <a href="./ch01-frames.html">第 01 章</a></div>
    <h1>第 02 章　自行车模型与 ICR</h1>
    <p class="lead">拖转角看瞬时转动中心怎么动、转弯半径怎么变。约定与课件相同：x 向前、y 向左、ψ 逆时针为正。教学车轴距 L = 2.8 m。</p>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="icr">ICR 几何</button>
      <button class="tab" data-tab="eq">三行方程</button>
      <button class="tab" data-tab="circle">常转角走圆</button>
      <button class="tab" data-tab="cg">质心上的 β</button>
    </div>

    <div class="layout">
      <div>
        <div class="panel">
          <svg id="scene" viewBox="0 0 640 420"></svg>
          <label class="row">前轮转角 δ <span id="deltaVal"></span></label>
          <input id="delta" type="range" min="-35" max="35" step="1" value="18" />
          <label class="row">速度 v <span id="vVal"></span></label>
          <input id="v" type="range" min="-12" max="20" step="0.5" value="8" />
          <button class="play" id="playBtn" type="button">播放绕圈</button>
        </div>
      </div>
      <div class="side">
        <div class="panel" id="info"></div>
        <div id="flag"></div>
      </div>
    </div>
  </div>
  <script>
    const L = 2.8, LR = 1.6, TRACK = 1.5;
    const state = { tab: "icr", deltaDeg: 18, v: 8, play: false, psi: 0, t0: 0 };
    const rot = (psi, x, y) => ({ x: Math.cos(psi) * x - Math.sin(psi) * y, y: Math.sin(psi) * x + Math.cos(psi) * y });
    const fmt = (n, d = 2) => (Math.abs(n) < 1e-9 ? 0 : n).toFixed(d);
    const toDeg = (r) => r * 180 / Math.PI;

    function el(name, attrs, children) {
      const n = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v));
      (children || []).forEach((c) => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
      return n;
    }

    function kinematics() {
      const delta = state.deltaDeg * Math.PI / 180;
      const tan = Math.tan(delta);
      const straight = Math.abs(delta) < 1e-4;
      const R = straight ? Infinity : L / tan;
      const kappa = straight ? 0 : tan / L;
      const psidot = straight ? 0 : state.v / R;
      const ay = straight ? 0 : state.v * state.v * Math.abs(kappa);
      const beta = straight ? 0 : Math.atan(LR * tan / L);
      return { delta, R, kappa, psidot, ay, beta, straight };
    }

    function draw() {
      const k = kinematics();
      const svg = document.getElementById("scene");
      svg.innerHTML = "";
      svg.appendChild(el("defs", {}, [
        el("marker", { id: "arr2", viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" }, [
          el("path", { d: "M 0 1.2 L 9 5 L 0 8.8 z", fill: "#1f2937" })
        ])
      ]));

      const ox = 90, oy = 360, sc = 42;
      const to = (x, y) => ({ x: ox + sc * x, y: oy - sc * y });
      const psi = state.tab === "circle" ? state.psi : 0;
      const rear = { x: 4.2, y: 2.55 };
      const ex = rot(psi, 1, 0), ey = rot(psi, 0, 1);
      const signedR = k.straight ? 8 : k.R;
      const icr = { x: rear.x + ey.x * signedR, y: rear.y + ey.y * signedR };
      const front = { x: rear.x + ex.x * L, y: rear.y + ex.y * L };
      const cg = { x: rear.x + ex.x * LR, y: rear.y + ex.y * LR };

      const corners = [
        rot(psi, 2.5, 0.75), rot(psi, 2.5, -0.75), rot(psi, -1.3, -0.75), rot(psi, -1.3, 0.75)
      ].map((p) => to(rear.x + p.x, rear.y + p.y));
      svg.appendChild(el("polygon", { points: corners.map((p) => p.x + "," + p.y).join(" "), fill: "#e5e7eb", stroke: "#374151", "stroke-width": 1.7 }));

      const addWheel = (cx, cy, heading) => {
        const pts = [[0.42, 0.16], [0.42, -0.16], [-0.42, -0.16], [-0.42, 0.16]]
          .map(([x, y]) => { const p = rot(heading, x, y); return to(cx + p.x, cy + p.y); });
        svg.appendChild(el("polygon", { points: pts.map((p) => p.x + "," + p.y).join(" "), fill: "#bbf7d0", stroke: "#15803d", "stroke-width": 1.4 }));
      };

      if (state.tab === "icr") {
        const tin = TRACK / 2;
        addWheel(rear.x + ey.x * tin, rear.y + ey.y * tin, psi);
        addWheel(rear.x - ey.x * tin, rear.y - ey.y * tin, psi);
        const dIn = Math.atan(L / (signedR - tin));
        const dOut = Math.atan(L / (signedR + tin));
        const sign = state.deltaDeg >= 0 ? 1 : -1;
        addWheel(front.x + ey.x * tin, front.y + ey.y * tin, psi + sign * Math.abs(dIn));
        addWheel(front.x - ey.x * tin, front.y - ey.y * tin, psi + sign * Math.abs(dOut));
        svg.appendChild(el("text", { x: 18, y: 24, fill: "#6b7280", "font-size": 12 }, ["四轮轴线都指向 ICR。内侧转角更大。δ=0 时 ICR 在无穷远，走直线。"]));
      } else {
        addWheel(rear.x, rear.y, psi);
        addWheel(front.x, front.y, psi + k.delta);
        svg.appendChild(el("text", { x: 18, y: 24, fill: "#6b7280", "font-size": 12 }, ["自行车：中轴两轮。绿轮是前轮，相对车体转 δ。"]));
      }

      const oR = to(rear.x, rear.y), oF = to(front.x, front.y), oI = to(icr.x, icr.y), oC = to(cg.x, cg.y);
      svg.appendChild(el("circle", { cx: oR.x, cy: oR.y, r: 5, fill: "#2563eb" }));
      svg.appendChild(el("circle", { cx: oF.x, cy: oF.y, r: 5, fill: "#dc2626" }));
      if (!k.straight && Math.abs(signedR) < 12) {
        svg.appendChild(el("line", { x1: oR.x, y1: oR.y, x2: oI.x, y2: oI.y, stroke: "#9ca3af", "stroke-width": 1.3, "stroke-dasharray": "4 3" }));
        svg.appendChild(el("line", { x1: oF.x, y1: oF.y, x2: oI.x, y2: oI.y, stroke: "#9ca3af", "stroke-width": 1.3, "stroke-dasharray": "4 3" }));
        svg.appendChild(el("circle", { cx: oI.x, cy: oI.y, r: 6, fill: "#fff", stroke: "#dc2626", "stroke-width": 1.6 }));
        svg.appendChild(el("text", { x: oI.x - 8, y: oI.y - 10, fill: "#dc2626", "font-size": 13, "font-weight": 700, "text-anchor": "end" }, ["ICR"]));
        if (state.tab === "circle") {
          const csvg = to(icr.x, icr.y);
          svg.appendChild(el("circle", { cx: csvg.x, cy: csvg.y, r: Math.abs(signedR) * sc, fill: "none", stroke: "#2563eb", "stroke-width": 1.4, "stroke-dasharray": "6 4" }));
        }
      }
      if (state.tab === "cg") {
        svg.appendChild(el("circle", { cx: oC.x, cy: oC.y, r: 6, fill: "#ea580c" }));
        svg.appendChild(el("line", { x1: oC.x, y1: oC.y, x2: oI.x, y2: oI.y, stroke: "#ea580c", "stroke-width": 1.4, "stroke-dasharray": "4 3" }));
      }
      const tip = rot(psi, 1.6, 0);
      svg.appendChild(el("line", { x1: oR.x, y1: oR.y, x2: to(rear.x + tip.x, rear.y + tip.y).x, y2: to(rear.x + tip.x, rear.y + tip.y).y, stroke: "#15803d", "stroke-width": 2.3, "marker-end": "url(#arr2)" }));

      document.getElementById("deltaVal").textContent = fmt(state.deltaDeg, 0) + " deg";
      document.getElementById("vVal").textContent = fmt(state.v, 1) + " m/s";

      const ayG = k.ay / 9.81;
      const info = document.getElementById("info");
      if (state.tab === "icr") {
        info.innerHTML = `<h3>Ackermann 几何</h3>
          <div class="stats"><div class="stat"><b>${k.straight ? "∞" : fmt(k.R, 2)}</b><span>R (m)</span></div>
          <div class="stat"><b>${fmt(state.deltaDeg, 0)}°</b><span>等效 δ</span></div></div>
          <p>后轮转角为 0，ICR 只能在后轴延长线上。内侧邻边更短，所以内侧 δ 更大。</p>
          <pre>tan δ = L / R
R = L / tanδ</pre>`;
      } else if (state.tab === "eq") {
        info.innerHTML = `<h3>后轴自行车模型</h3>
          <div class="stats"><div class="stat"><b>${fmt(toDeg(k.psidot), 1)}°</b><span>ψ̇ (deg/s)</span></div>
          <div class="stat"><b>${fmt(k.kappa, 3)}</b><span>κ (1/m)</span></div></div>
          <pre>Ẋ = v cosψ
Ẏ = v sinψ
ψ̇ = (v / L) tanδ</pre>
          <p>v 只出现在快慢里；半径由 δ 和 L 锁死。</p>`;
      } else if (state.tab === "circle") {
        info.innerHTML = `<h3>常 δ、常 v → 圆</h3>
          <div class="stats"><div class="stat"><b>${k.straight ? "直线" : fmt(Math.abs(k.R), 2)}</b><span>|R| (m)</span></div>
          <div class="stat"><b>${fmt(toDeg(state.psi), 0)}°</b><span>当前 ψ</span></div></div>
          <p>点「播放绕圈」：ψ 按 ψ̇ 积分，后轴沿蓝虚线圆走。v 变只改变快慢，不改变半径。</p>`;
      } else {
        info.innerHTML = `<h3>几何侧偏角 β</h3>
          <div class="stats"><div class="stat"><b>${fmt(toDeg(k.beta), 1)}°</b><span>β</span></div>
          <div class="stat"><b>${fmt(LR, 1)}</b><span>l_r (m)</span></div></div>
          <pre>tanβ = l_r tanδ / L</pre>
          <p>这是刚体几何，不是第 05 章由侧向力产生的动力学 β。橙点是质心。</p>`;
      }
      const flag = document.getElementById("flag");
      if (ayG > 0.3) {
        flag.className = "warn";
        flag.textContent = "侧向加速度约 " + fmt(ayG, 2) + " g，已经大于 0.3 g。运动学开始定性不准，真实轮胎需要侧偏角，实际弯会更「不足转向」。";
      } else {
        flag.className = "ok";
        flag.textContent = "a_y ≈ " + fmt(ayG, 2) + " g。低于约 0.3 g 时，几何圆和真车还比较接近。";
      }
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      state.tab = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b === btn));
      if (state.tab !== "circle") state.play = false;
      draw();
    });
    document.getElementById("delta").addEventListener("input", (e) => { state.deltaDeg = Number(e.target.value); draw(); });
    document.getElementById("v").addEventListener("input", (e) => { state.v = Number(e.target.value); draw(); });
    document.getElementById("playBtn").addEventListener("click", () => {
      state.tab = "circle";
      document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === "circle"));
      state.play = !state.play;
      document.getElementById("playBtn").textContent = state.play ? "暂停" : "播放绕圈";
      draw();
    });

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (state.play) {
        const k = kinematics();
        state.psi += k.psidot * dt;
        if (state.psi > Math.PI) state.psi -= 2 * Math.PI;
        if (state.psi < -Math.PI) state.psi += 2 * Math.PI;
        draw();
      }
      requestAnimationFrame(tick);
    }
    draw();
    requestAnimationFrame(tick);
  </script>
</body>
</html>

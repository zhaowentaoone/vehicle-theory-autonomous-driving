<text x="580.0" y="160.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#ea580c" text-anchor="start">R 的第 1 列 = 车体 x 轴</text>

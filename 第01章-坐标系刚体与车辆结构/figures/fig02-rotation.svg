<text x="580.0" y="216.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#6b7280" text-anchor="start">R⁻¹ = Rᵀ  （正交矩阵）</text>
<text x="580.0" y="250.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937" text-anchor="start">R(ψ) =</text>
<text x="580.0" y="286.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#2563eb" text-anchor="start">[  cosψ    −sinψ ]</text>
<text x="580.0" y="312.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#2563eb" text-anchor="start">[  sinψ     cosψ ]</text>
<text x="580.0" y="350.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#dc2626" text-anchor="start">本课程坑：不要写成</text>
<text x="580.0" y="374.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#dc2626" text-anchor="start">[ cos  sin ; −sin  cos ]</text>
<text x="580.0" y="398.0" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="start">那是顺时针为正或 y 向右。</text>
